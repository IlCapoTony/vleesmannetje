<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina niet gevonden | Vleesmannetje</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140B06">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<style>
:root{--ink:#140b06;--gold:#f0c03c;--flame:#f07818;--cream:#f7efe6;--muted:#c2ae9c}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem 1.25rem;text-align:center;
 background:var(--ink);color:var(--cream);
 font:400 1rem/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
 background:radial-gradient(50% 38% at 50% 30%,rgba(240,120,24,.22),transparent 70%)}
main{position:relative;max-width:30rem}
img{width:min(66vw,240px);margin:0 auto 1.75rem;display:block;height:auto}
h1{margin:0;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.1;letter-spacing:-.02em;font-weight:800}
p{margin:.9rem 0 0;color:var(--muted)}
a.btn{display:inline-block;margin-top:1.9rem;padding:.9rem 1.7rem;border-radius:999px;font-weight:700;
 background:linear-gradient(96deg,var(--gold),var(--flame));color:#1a0d04;text-decoration:none;
 box-shadow:0 8px 26px -10px rgba(240,120,24,.85);transition:transform .18s}
a.btn:hover,a.btn:focus-visible{transform:translateY(-2px)}
</style>
</head>
<body>
<main>
  <picture>
    <source srcset="/assets/img/logo-300.avif" type="image/avif">
    <img src="/assets/img/logo-300.webp" width="300" height="264" alt="Vleesmannetje">
  </picture>
  <h1>Deze is op</h1>
  <p>De pagina die je zoekt bestaat niet (meer). Terug naar de steak spots?</p>
  <a class="btn" href="/">Naar de homepage</a>
</main>
</body>
</html>
